services:
  # 1. Flask REST API Backend
  - type: web
    name: photography-agency-backend
    runtime: python
    rootDir: my-flask-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # 2. Next.js Frontend Web Application
  - type: web
    name: photography-agency-frontend
    runtime: node
    rootDir: my-next-project
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
