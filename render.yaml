services:
  # 1. Flask REST API Backend
  - type: web
    name: photography-agency-backend
    runtime: python
    rootDir: my-flask-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        value: velouracreations@gmail.com
      - key: MAIL_PASSWORD
        value: vlmfqhynjoawxcyv
      - key: MAIL_DEFAULT_SENDER
        value: Veloura Creations <velouracreations@gmail.com>

  # 2. Next.js Frontend Web Application
  - type: web
    name: photography-agency-frontend
    runtime: node
    rootDir: my-next-project
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
